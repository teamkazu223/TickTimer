<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>TickTimer 懸浮視窗產生器</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #111;
      color: #eee;
      text-align: center;
      padding: 15px;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      -webkit-user-select: none;
      user-select: none;
    }
    h1 {
      font-size: 24px;
      margin: 5px 0;
      color: #fff;
    }
    .subtitle {
      color: #888;
      font-size: 13px;
      margin-bottom: 15px;
    }
    
    .url-box {
      width: 100%;
      max-width: 350px;
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
    }
    .url-box input {
      flex: 1;
      background: #222;
      border: 1px solid #444;
      color: #fff;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
    }
    .url-box button {
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 0 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .iframe-controls {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 15px;
      width: 100%;
      max-width: 350px;
      background: #1a1a1a;
      padding: 15px 10px;
      border-radius: 12px;
      box-sizing: border-box;
    }
    .control-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      width: 100%;
    }
    .control-row span {
      font-size: 12px;
      color: #aaa;
      width: 60px;
      text-align: right;
    }
    .iframe-controls button {
      background: #333;
      color: #fff;
      border: 1px solid #555;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 13px;
      cursor: pointer;
      touch-action: manipulation;
      flex: 1;
    }
    .iframe-controls button:active {
      background: #555;
    }

    .preview-label {
      font-size: 12px;
      color: #4ade80;
      margin-bottom: 5px;
      font-weight: bold;
    }
    .iframe-container {
      border-radius: 12px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.5);
      margin-bottom: 25px;
      background: #fff;
      overflow: hidden;
      border: 3px solid #3b82f6;
      display: flex;
      flex-direction: column;
    }
    .drag-handle {
      width: 100%;
      height: 24px;
      background: #3b82f6;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: bold;
      cursor: move;
    }
    .iframe-wrapper {
      background: #fff;
      overflow: hidden;
      position: relative;
      transition: width 0.2s, height 0.2s;
    }
    
    /* 
      終極解法：在 iframe 上面蓋一塊絕對定位的透明玻璃。
      這樣所有的點擊都會被這塊玻璃擋住，絕對點不到裡面的 iframe！
    */
    .iframe-wrapper::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 10; 
      /* 確保玻璃在最上層，且會攔截所有點擊 */
    }

    /* 針對 iframe 增加額外的沙盒限制 */
    iframe {
      width: 800px;
      height: 1000px;
      border: none;
      transform-origin: top left;
      transition: margin 0.2s ease-out, transform 0.2s ease-out;
    }

    .export-box {
      width: 100%;
      max-width: 350px;
      background: #222;
      padding: 20px;
      border-radius: 16px;
      box-sizing: border-box;
    }
    .export-box h3 {
      margin-top: 0;
      color: #3b82f6;
      font-size: 16px;
      margin-bottom: 10px;
    }
    .export-box p {
      font-size: 12px;
      color: #aaa;
      text-align: left;
      line-height: 1.5;
      margin-bottom: 15px;
    }
    .export-box textarea {
      width: 100%;
      height: 70px;
      background: #111;
      color: #4ade80;
      border: 1px solid #444;
      border-radius: 8px;
      padding: 10px;
      font-family: monospace;
      font-size: 11px;
      box-sizing: border-box;
      margin-bottom: 15px;
      resize: none;
    }
    .export-box button {
      background: #4ade80;
      color: #000;
      border: none;
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
      width: 100%;
      touch-action: manipulation;
    }
    .export-box button:active {
      background: #22c55e;
    }
  </style>
</head>
<body>

  <h1>TickTimer</h1>
  <div class="subtitle">Navyism 懸浮視窗產生器</div>

  <div class="url-box">
    <input type="url" id="targetUrl" value="https://kktix.com" placeholder="輸入售票網址 (僅預覽用)">
    <button onclick="loadNavyism()">預覽時鐘</button>
  </div>
  
  <div class="iframe-controls">
    <div class="control-row">
      <span>視窗大小:</span>
      <button onclick="adjustWrapperW(-20)">寬度 -</button>
      <button onclick="adjustWrapperW(20)">寬度 +</button>
      <button onclick="adjustWrapperH(-10)">高度 -</button>
      <button onclick="adjustWrapperH(10)">高度 +</button>
    </div>
    <div class="control-row">
      <span>縮放時鐘:</span>
      <button onclick="adjustScale(-0.05)">- 縮小</button>
      <button onclick="adjustScale(0.05)">+ 放大</button>
    </div>
    <div class="control-row">
      <span>時鐘位置:</span>
      <button onclick="adjustIframeX(-20)">←</button>
      <button onclick="adjustIframeX(20)">→</button>
      <button onclick="adjustIframeY(-30)">↑</button>
      <button onclick="adjustIframeY(30)">↓</button>
    </div>
  </div>

  <div class="preview-label">👇 您在搶票網頁上看到的真實大小 👇</div>
  <div class="iframe-container" id="previewContainer">
    <div class="drag-handle">✥ 拖曳此處 ✥</div>
    <div class="iframe-wrapper" id="previewWrapper">
      <!-- 加入 sandbox 屬性，徹底封殺 iframe 內的 JavaScript 自動導頁 (Top Navigation) 行為 -->
      <iframe id="navyismFrame" src="https://time.navyism.com/?host=https://kktix.com" scrolling="no" sandbox="allow-scripts allow-same-origin"></iframe>
    </div>
  </div>

  <div class="export-box">
    <h3>🚀 匯出成書籤小工具</h3>
    <p>調整好上方畫面後，點擊複製下方代碼。將此代碼儲存為 Safari 書籤。<br><br>💡 <b>使用方式：</b>在搶票網頁 (如 KKTIX) 點擊該書籤，時鐘就會直接懸浮在右下角，且點擊可穿透不擋畫面！(再點一次書籤可關閉)</p>
    <textarea id="bookmarkletCode" readonly></textarea>
    <button onclick="copyCode()">📋 複製程式碼</button>
  </div>

  <script>
    // 控制外框大小的變數 (預設加寬至 280)
    let wrapperWidth = 280;
    let wrapperHeight = 70;

    // 控制 iframe 狀態的變數
    let iframeOffset = -220; // Y軸 (上下)
    let iframeOffsetX = -40; // X軸 (左右)
    let iframeScale = 0.70;  // 縮放比例

    window.onload = function() {
      updateIframeStyle();
    };

    // 統一更新樣式，並即時產生新的書籤程式碼
    function updateIframeStyle() {
      // 1. 更新外框 (Wrapper) 大小
      const wrapper = document.getElementById('previewWrapper');
      wrapper.style.width = wrapperWidth + 'px';
      wrapper.style.height = wrapperHeight + 'px';

      // 2. 更新內部時鐘偏移與縮放
      const iframe = document.getElementById('navyismFrame');
      iframe.style.marginTop = iframeOffset + 'px';
      iframe.style.marginLeft = iframeOffsetX + 'px';
      iframe.style.transform = `scale(${iframeScale})`;
      
      updateBookmarklet();
    }

    // 更新產生的書籤程式碼
    function updateBookmarklet() {
      // 直接讀取你在上方輸入框打的網址，強制燒錄進代碼裡，不再抓取 window.location.origin
      const targetUrl = document.getElementById('targetUrl').value || 'https://kktix.com';
      const encodedHost = encodeURIComponent(targetUrl);

      // ★ 這次在產生的書籤中，強制加入了 iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin'); 徹底封殺跳轉 ★
      const jsCode = `javascript:(function(){var id='nv-floater';var old=document.getElementById(id);if(old){old.remove();return;}var div=document.createElement('div');div.id=id;div.style.cssText='position:fixed;bottom:80px;right:20px;width:${wrapperWidth}px;z-index:2147483647;pointer-events:none;display:flex;flex-direction:column;box-shadow:0 5px 20px rgba(0,0,0,0.5);border-radius:12px;border:3px solid #3b82f6;overflow:hidden;background:#fff;';var handle=document.createElement('div');handle.innerHTML='&#10022; 拖曳此處';handle.style.cssText='width:100%;height:24px;background:#3b82f6;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;cursor:move;pointer-events:auto;user-select:none;font-weight:bold;font-family:sans-serif;';var content=document.createElement('div');content.style.cssText='width:${wrapperWidth}px;height:${wrapperHeight}px;background:#fff;overflow:hidden;pointer-events:none;box-sizing:border-box;';var iframe=document.createElement('iframe');iframe.src='https://time.navyism.com/?host=${encodedHost}';iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin');iframe.style.cssText='width:800px;height:1000px;border:none;margin-top:${iframeOffset}px;margin-left:${iframeOffsetX}px;transform:scale(${iframeScale});transform-origin:top left;pointer-events:none;';content.appendChild(iframe);div.appendChild(handle);div.appendChild(content);document.body.appendChild(div);var isDown=false,startX,startY,startL,startT;function down(e){isDown=true;var c=e.touches?e.touches[0]:e;startX=c.clientX;startY=c.clientY;startL=div.offsetLeft;startT=div.offsetTop;if(e.cancelable)e.preventDefault();}function move(e){if(!isDown)return;var c=e.touches?e.touches[0]:e;div.style.right='auto';div.style.bottom='auto';div.style.left=(startL+c.clientX-startX)+'px';div.style.top=(startT+c.clientY-startY)+'px';if(e.cancelable)e.preventDefault();}function up(){isDown=false;}handle.addEventListener('mousedown',down);document.addEventListener('mousemove',move,{passive:false});document.addEventListener('mouseup',up);handle.addEventListener('touchstart',down,{passive:false});document.addEventListener('touchmove',move,{passive:false});document.addEventListener('touchend',up);})();`;
      
      document.getElementById('bookmarkletCode').value = jsCode;
    }

    // 外框寬高調整
    function adjustWrapperW(delta) {
      wrapperWidth += delta;
      if (wrapperWidth < 100) wrapperWidth = 100;
      updateIframeStyle();
    }
    function adjustWrapperH(delta) {
      wrapperHeight += delta;
      if (wrapperHeight < 40) wrapperHeight = 40;
      updateIframeStyle();
    }

    // 畫面微調功能 (上下)
    function adjustIframeY(delta) {
      iframeOffset += delta;
      updateIframeStyle();
    }

    // 畫面微調功能 (左右)
    function adjustIframeX(delta) {
      iframeOffsetX += delta;
      updateIframeStyle();
    }

    // 畫面縮放功能
    function adjustScale(delta) {
      iframeScale += delta;
      if (iframeScale < 0.3) iframeScale = 0.3; 
      if (iframeScale > 1.5) iframeScale = 1.5; 
      updateIframeStyle();
    }

    // 載入 Navyism 預覽
    function loadNavyism() {
      const url = document.getElementById('targetUrl').value;
      if(url) {
        document.getElementById('navyismFrame').src = `https://time.navyism.com/?host=${encodeURIComponent(url)}`;
        updateBookmarklet(); // 確保輸入新網址時，下方產生的代碼也同步更新
      }
    }

    // 複製程式碼功能
    function copyCode() {
      const textArea = document.getElementById('bookmarkletCode');
      textArea.select();
      textArea.setSelectionRange(0, 99999); // 確保手機端能完整選取
      try {
        document.execCommand('copy');
        alert("✅ 程式碼已成功複製！\n\n請前往 Safari 把這段代碼取代為某個書籤的「網址」，搶票時點擊該書籤即可喚出懸浮窗。");
      } catch (err) {
        alert("複製失敗，請手動全選框內的文字並複製。");
      }
    }
  </script>
</body>
</html>
